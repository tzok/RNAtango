version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/rnatango-frontend"
    schedule:
      interval: "weekly"
