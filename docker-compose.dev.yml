services:
  web:
    ports:
      - "8080:8080"

  frontend-dev:
    image: node:20-bookworm
    profiles: ["dev"]
    working_dir: /app
    depends_on:
      - web
    environment:
      NEXT_PUBLIC_SERVER_URL: http://localhost:8080/api
      NEXT_PUBLIC_SERVER_WEB_SOCKET_URL: ws://localhost:8080/api/ws
    volumes:
      - ./rnatango-frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "npm ci && npm run dev"
    ports:
      - "3000:3000"

volumes:
  frontend_node_modules:
